name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/eugene1805/saas-identity

jobs:
  build-and-test:
    name: Build, unit and multi-Postgres integration tests (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Saas.Identity.slnx

      - name: Build solution
        run: dotnet build Saas.Identity.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Saas.Identity.UnitTests/Saas.Identity.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run multi-instance PostgreSQL integration tests (Testcontainers)
        run: dotnet test tests/Saas.Identity.IntegrationTests/Saas.Identity.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  docker-build:
    name: Docker build and multi-DB integration verification
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: |
          docker build \
            --file Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=saas-identity" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Verify container health probes, Newman suite and gRPC provisioning across 4 PostgreSQL instances
        run: |
          set -euo pipefail
          DB_NAMES=(
            "saas-identity-ci-global-db"
            "saas-identity-ci-norte-db"
            "saas-identity-ci-valle-db"
            "saas-identity-ci-aurora-db"
          )

          cleanup() {
            local status=$?
            if [ "${status}" -ne 0 ]; then
              if docker ps -a --format '{{.Names}}' | grep -qx 'saas-identity-ci'; then
                echo "=== saas-identity-ci logs ==="
                docker logs saas-identity-ci || true
              fi
              for db in "${DB_NAMES[@]}"; do
                if docker ps -a --format '{{.Names}}' | grep -qx "${db}"; then
                  echo "=== ${db} logs ==="
                  docker logs "${db}" || true
                fi
              done
            fi
            docker rm -f saas-identity-ci "${DB_NAMES[@]}" >/dev/null 2>&1 || true
            docker network rm saas-identity-ci-net >/dev/null 2>&1 || true
            if [ -n "${CI_KEY_DIR:-}" ] && [ -d "${CI_KEY_DIR}" ]; then
              rm -rf "${CI_KEY_DIR}" || true
            fi
          }
          trap cleanup EXIT

          GLOBAL_PASS=$(openssl rand -hex 16)
          NORTE_PASS=$(openssl rand -hex 16)
          VALLE_PASS=$(openssl rand -hex 16)
          AURORA_PASS=$(openssl rand -hex 16)
          CI_KEY_DIR=$(mktemp -d)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${CI_KEY_DIR}/jwt-private.pem" >/dev/null 2>&1
          openssl pkey -in "${CI_KEY_DIR}/jwt-private.pem" -pubout -out "${CI_KEY_DIR}/jwt-public.pem" >/dev/null 2>&1
          CI_JWT_PRIVATE_PEM=$(cat "${CI_KEY_DIR}/jwt-private.pem")
          CI_JWT_PUBLIC_PEM=$(cat "${CI_KEY_DIR}/jwt-public.pem")
          CI_REFRESH_HMAC_KEY=$(openssl rand -hex 32)
          CI_GRPC_KEY=$(openssl rand -hex 24)

          docker network create saas-identity-ci-net

          start_pg() {
            local name="$1"
            local db="$2"
            local user="$3"
            local pass="$4"
            docker run -d \
              --name "${name}" \
              --network saas-identity-ci-net \
              -e "POSTGRES_DB=${db}" \
              -e "POSTGRES_USER=${user}" \
              -e "POSTGRES_PASSWORD=${pass}" \
              postgres:17-alpine
          }

          wait_pg() {
            local name="$1"
            local db="$2"
            local user="$3"
            local pass="$4"
            local ready=0
            for i in $(seq 1 45); do
              if docker exec "${name}" pg_isready -h 127.0.0.1 -p 5432 -U "${user}" -d "${db}" >/dev/null 2>&1 && \
                 docker exec -e "PGPASSWORD=${pass}" "${name}" psql -h 127.0.0.1 -p 5432 -U "${user}" -d "${db}" -tAc "SELECT 1" 2>/dev/null | grep -qx 1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "${ready}" -ne 1 ]; then
              echo "PostgreSQL container ${name} did not become ready on TCP 5432 within 45s"
              exit 1
            fi
            docker exec "${name}" pg_isready -h 127.0.0.1 -p 5432 -U "${user}" -d "${db}"
          }

          start_pg "saas-identity-ci-global-db" "vital_identity_global" "vital_identity_global" "${GLOBAL_PASS}"
          start_pg "saas-identity-ci-norte-db"  "vital_identity_norte"  "vital_identity_norte"  "${NORTE_PASS}"
          start_pg "saas-identity-ci-valle-db"  "vital_identity_valle"  "vital_identity_valle"  "${VALLE_PASS}"
          start_pg "saas-identity-ci-aurora-db" "vital_identity_aurora" "vital_identity_aurora" "${AURORA_PASS}"

          wait_pg "saas-identity-ci-global-db" "vital_identity_global" "vital_identity_global" "${GLOBAL_PASS}"
          wait_pg "saas-identity-ci-norte-db"  "vital_identity_norte"  "vital_identity_norte"  "${NORTE_PASS}"
          wait_pg "saas-identity-ci-valle-db"  "vital_identity_valle"  "vital_identity_valle"  "${VALLE_PASS}"
          wait_pg "saas-identity-ci-aurora-db" "vital_identity_aurora" "vital_identity_aurora" "${AURORA_PASS}"

          docker run -d \
            --name saas-identity-ci \
            --network saas-identity-ci-net \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -p 127.0.0.1:8080:8080 \
            -p 127.0.0.1:8082:8082 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ConnectionStrings__IdentityGlobalDb="Host=saas-identity-ci-global-db;Port=5432;Database=vital_identity_global;Username=vital_identity_global;Password=${GLOBAL_PASS}" \
            -e TenantDatabases__Connections__10000000-0000-0000-0000-000000000001="Host=saas-identity-ci-norte-db;Port=5432;Database=vital_identity_norte;Username=vital_identity_norte;Password=${NORTE_PASS}" \
            -e TenantDatabases__Connections__10000000-0000-0000-0000-000000000002="Host=saas-identity-ci-valle-db;Port=5432;Database=vital_identity_valle;Username=vital_identity_valle;Password=${VALLE_PASS}" \
            -e TenantDatabases__Connections__10000000-0000-0000-0000-000000000003="Host=saas-identity-ci-aurora-db;Port=5432;Database=vital_identity_aurora;Username=vital_identity_aurora;Password=${AURORA_PASS}" \
            -e Jwt__Issuer=saas-identity \
            -e Jwt__Audience=vital-saas \
            -e Jwt__PrivateKeyPem="${CI_JWT_PRIVATE_PEM}" \
            -e Jwt__PublicKeyPem="${CI_JWT_PUBLIC_PEM}" \
            -e Jwt__RefreshTokenHmacKey="${CI_REFRESH_HMAC_KEY}" \
            -e Ports__Http=8080 \
            -e Ports__Grpc=8082 \
            -e InternalGrpc__ApiKey="${CI_GRPC_KEY}" \
            -e Email__Mode=LogOnly \
            -e Platform__Mode=Local \
            -e SeedDemoData=true \
            -e DemoSeed__Password="Vital2026!" \
            -e OpenApi__Enabled=true \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          api_ready=0
          for i in $(seq 1 45); do
            if [ "$(docker inspect -f '{{.State.Running}}' saas-identity-ci 2>/dev/null || echo false)" != "true" ]; then
              echo "saas-identity-ci exited unexpectedly during startup"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if [ "${api_ready}" -ne 1 ]; then
            echo "saas-identity-ci did not pass /health/ready within 45s"
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/health/live
          echo ""
          curl -fsS http://127.0.0.1:8080/health/ready
          echo ""
          curl -fsS http://127.0.0.1:8080/health
          echo ""
          curl -fsS http://127.0.0.1:8080/openapi/v1.json >/dev/null

          docker run --rm \
            --network saas-identity-ci-net \
            -v "${GITHUB_WORKSPACE}/tests/postman:/etc/newman:ro" \
            postman/newman:alpine \
            run /etc/newman/Vital.Identity.postman_collection.json \
            --env-var "baseUrl=http://saas-identity-ci:8080"

          docker run --rm \
            --network saas-identity-ci-net \
            fullstorydev/grpcurl:latest \
            -plaintext \
            -H "x-internal-service-key: ${CI_GRPC_KEY}" \
            -d '{"tenant_id":"10000000-0000-0000-0000-000000000003","provisioning_request_id":"prov-ci-aurora-001","clinic_slug":"clinica-aurora","clinic_name":"Unidad Clinica Aurora","admin_full_name":"Mtro. Ernesto Cardenas","admin_email":"admin@aurora.vital.demo"}' \
            saas-identity-ci:8082 vital.platform_identity.v1.IdentityProvisioningService/ProvisionInitialClinicAdmin

      - name: Save validated image artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o /tmp/saas-identity-image.tar

      - name: Upload validated image artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas-identity-image-${{ github.sha }}
          path: /tmp/saas-identity-image.tar
          retention-days: 1
          if-no-files-found: error

  publish-ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Download validated image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saas-identity-image-${{ github.sha }}
          path: /tmp

      - name: Load validated container image
        run: docker load -i /tmp/saas-identity-image.tar

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push validated image and record digest
        run: |
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}")
          {
            echo "### GHCR Publication Summary"
            echo ""
            echo "- **Image reference:** \`${IMAGE_REF}\`"
            echo "- **Published digest:** \`${DIGEST}\`"
            echo "- **Source commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Event / Ref:** \`${GITHUB_EVENT_NAME}\` / \`${GITHUB_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true
